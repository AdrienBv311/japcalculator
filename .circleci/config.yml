version: 2.1

jobs:
  build-and-test:
    docker:
      - image: cimg/node:20.11
    steps:
      - checkout
      - run:
          name: Installer les dependances
          command: npm install
      - run:
          name: Lancer les tests
          command: CI=true npm test
      - run:
          name: Construire l'application
          command: npm run build

workflows:
  test-and-build:
    jobs:
      - build-and-test
